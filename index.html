<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetry Monitor - Web Installer</title>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <style>
        body { background-color: #111; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 40px 20px; }
        .card { background: #1e1e1e; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #333; }
        h1 { color: #00b4d8; margin-bottom: 5px; }
        p { color: #ccc; line-height: 1.5; }
        select { background: #2a2a2a; color: #00b4d8; border: 1px solid #00b4d8; padding: 10px; font-size: 16px; border-radius: 6px; margin: 15px 0; outline: none; width: 80%; cursor: pointer; }
        esp-web-install-button { margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>

<div class="card">
    <h1>Telemetry Monitor</h1>
    <h3>Web Firmware Installer</h3>
    <p>Vyberte požadovanou verzi firmwaru, připojte zařízení přes USB a klikněte na Connect.</p>
    
    <!-- Výběrové menu verzí -->
    <select id="versionSelect" onchange="updateManifest()">
        <option value="manifest_v1.1.0.json">v1.1.0 (Nejnovější - Stable)</option>
        <option value="manifest_v1.0.0.json">v1.0.0 (Původní verze)</option>
    </select>
    <br>

    <!-- Tlačítko instalační lišty -->
    <esp-web-install-button id="installer" manifest="manifest_v1.1.0.json"></esp-web-install-button>
</div>

<script>
    function updateManifest() {
        const select = document.getElementById('versionSelect');
        const installer = document.getElementById('installer');
        // Přepne manifest podle vybrané možnosti v menu
        installer.setAttribute('manifest', select.value);
    }
</script>

</body>
</html>
