<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetry Monitor - Web Installer</title>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <style>
        body { background-color: #111; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 40px 20px; }
        .card { background: #1e1e1e; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #333; }
        h1 { color: #00b4d8; margin-bottom: 5px; }
        p { color: #ccc; line-height: 1.5; }
        
        select { background: #2a2a2a; color: #00b4d8; border: 1px solid #00b4d8; padding: 10px; font-size: 16px; border-radius: 6px; margin: 15px 0; outline: none; width: 100%; cursor: pointer; }
        
        .changelog {
            background: #252525;
            border-left: 4px solid #00b4d8;
            padding: 12px 15px;
            text-align: left;
            margin: 15px 0;
            border-radius: 4px;
            font-size: 14px;
            color: #ddd;
        }
        .changelog ul { margin: 5px 0 0 20px; padding: 0; }
        
        esp-web-install-button { margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>

<div class="card">
    <h1>Škoda Telemetry Monitor</h1>
    <h3>Web Firmware Installer</h3>
    <p>created by Mario</p>
    <p>Vyberte verzi firmwaru, připojte zařízení k PC a klikněte na Connect.</p>
    
    <!-- Výběr verze -->
    <select id="versionSelect" onchange="updateVersion()">
      <option value="v1.0.0">v1.0.0 - KAROQ Sportline 1.5 TSI EVO2 - Ideaspark 1.9 display</option>
    </select>

    <!-- Popis verze -->
    <div id="versionDescription" class="changelog"></div>

    <!-- Tlačítko pro instalaci -->
    <esp-web-install-button id="installer"></esp-web-install-button>
</div>

<script>
    const versionData = { 
        "v1.0.0": {
            manifest: "manifest_v1.0.0.json",
            description: `
                <b>Verze 1.0.0 (Původní release):</b>
                <ul>
                  <li>Logo KAROQ + Sportline při startu</li>
                  <li>Základní telemetrie: rychlost, teplota kapaliny a oleje, napětí ECU a hladina oleje</li>
                  <li>Doplňková telemetrie: napětí OBD, kroutící moment motoru, teplota katalyzátoru, paliva a výfuku, degradace oleje</li>
                  <li>Primárně určeno pro motor DXD (EA211 1.5 TSI KAROQ)</li>
                  <li><b>Rozšířená kompatibilita EA211 (netestováno):</b><br>
                  <small style="color:#aaa;">CMBA, CPVA, CXSA, CXSB, CPVB, CHPA, CHPB, CZCC, CZCA, CZCB, CZDB, CZDA, CZTA, CVNA, CPTA, CZEA, DGXA, DJKA, DJZA, DJSA, DLEA, CHZA, CYVA, CYVB, DACA, DADA, DPCA, DSBA</small></li>                    
                </ul>
            `
        }
    };

    function updateVersion() {
        const selectedVersion = document.getElementById('versionSelect').value;
        const installer = document.getElementById('installer');
        const descBox = document.getElementById('versionDescription');

        installer.setAttribute('manifest', versionData[selectedVersion].manifest);
        descBox.innerHTML = versionData[selectedVersion].description;
    }

    updateVersion();
</script>

</body>
</html>
